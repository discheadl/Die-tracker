<div
  class="modal-backdrop"
  role="presentation"
  tabindex="-1"
  (click)="onBackdropClick($event)"
  (keydown)="onKeydown($event)"
>
  <div class="card glass-light modal-card" role="dialog" aria-modal="true" aria-label="Nueva ubicación">
    <div class="modal-header">
      <h2>Nueva ubicación</h2>
      <button type="button" class="modal-close" (click)="close.emit()" aria-label="Cerrar">&times;</button>
    </div>

    @if (errorMsg()) {
      <p class="error-text">{{ errorMsg() }}</p>
    }

    <form class="modal-form" [formGroup]="form" (ngSubmit)="save()">
      <label>
        Tipo
        <select class="input-field" formControlName="type">
          @for (opt of typeOptions; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </label>

      <label>
        Nombre
        <input class="input-field" formControlName="name" placeholder="Ej. Almacén 1" />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <span class="field-error">Falta el nombre.</span>
        }
      </label>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" (click)="close.emit()" [disabled]="saving()">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Creando...' : 'Crear ubicación' }}
        </button>
      </div>
    </form>
  </div>
</div>
