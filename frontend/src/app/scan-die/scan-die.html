<section class="page">
  <header class="page-header">
    <h1>Escanear dado</h1>
    <p class="page-subtitle">Escanea el código QR grabado en el dado con el lector para abrir su ficha.</p>
  </header>

  <form class="card scan-card" (submit)="onSubmit($event)">
    <label class="scan-label" for="scan-input">Número de dado</label>
    <input
      #scanInput
      id="scan-input"
      class="input-field scan-input"
      type="text"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="Esperando lectura del escáner..."
      [disabled]="searching()"
    />

    @if (searching()) {
      <p class="muted">Buscando dado...</p>
    }

    @if (errorMsg()) {
      <p class="error-text">{{ errorMsg() }}</p>
    }

    <p class="muted scan-help">
      El escáner también funciona desde cualquier otra pantalla. Aquí puedes escribir el número a mano y presionar
      Enter.
    </p>
  </form>
</section>
